[project]
# Rename to your dashboard's name if you keep more than one experience app.
name = "automation-dashboard"
version = "0.1.0"
description = "The automation system's dashboard: one web page per capability, each form built from the capability's contract."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "markupsafe>=2.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2",
    "markdown>=3.7",
    # Backing store for the app's own data (the Background documents area).
    "supabase>=2.31.0",
    # The Content Creation Team area's own outbound GitHub commit client
    # (_feldklang_repo.py) needs this directly, not just transitively
    # through a pinned capability.
    "httpx>=0.27",
    # Capability modules, one per page. Added with:
    #   uv add "<name> @ git+https://github.com/onlinemoose/<name>.git@vX.Y.Z"
    # which records the pin in [tool.uv.sources] below and the exact commit
    # in uv.lock.
    "cover-letter-writer",
    "cv-writer",
    "job-analyst",
    "targeted-editor",
    "content-creation-team",
    "publish-to-website",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "import-linter>=2",
    "python-dotenv>=1",
]

[project.scripts]
dashboard = "dashboard.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dashboard"]
# non-.py files under dashboard/ (templates, static, page example inputs)
# are included in the build by default.

[tool.pytest.ini_options]
addopts = "-q"

[tool.uv.sources]
cover-letter-writer = { git = "https://github.com/onlinemoose/cover-letter-writer.git", rev = "v0.13.1" }
cv-writer = { git = "https://github.com/onlinemoose/cv-writer.git", rev = "v0.6.2" }
job-analyst = { git = "https://github.com/onlinemoose/job-analyst.git", rev = "v0.2.0" }
targeted-editor = { git = "https://github.com/onlinemoose/targeted-editor.git", rev = "v0.1.0" }
content-creation-team = { git = "https://github.com/onlinemoose/content-creation-team.git", rev = "v0.2.0" }
# Interim pin by commit, not tag: pushing the v0.1.0 tag to
# publish-to-website was rejected by GitHub (likely a tag-protection rule
# on the template repo) — see docs/PROGRESS.md. Move this to
# `rev = "v0.1.0"` once the tag exists.
publish-to-website = { git = "https://github.com/onlinemoose/publish-to-website.git", rev = "03265e165784167f2fedda6f4267bfc2bce90fc1" }
