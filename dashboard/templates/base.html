<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Automation Dashboard{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  {% if stub_runs %}
  <p class="stubbanner">Stub mode — results are canned <code>example_output</code>; no capability is called.</p>
  {% endif %}
  <header class="topbar">
    <a class="brand" href="/">Automation&nbsp;Dashboard</a>
    <nav>{% block nav %}<a href="/jobs">Job posts</a> <a href="/documents">Background documents</a> <a href="/logout">Sign out</a>{% endblock %}</nav>
  </header>
  <main>
    {% block main %}{% endblock %}
  </main>
</body>
</html>
