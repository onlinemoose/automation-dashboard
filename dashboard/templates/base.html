<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Automation Dashboard{% endblock %}</title>
  <link rel="icon" href="/static/favicon.svg?v={{ asset_v }}" type="image/svg+xml">
  <link rel="stylesheet" href="/static/app.css?v={{ asset_v }}">
</head>
<body>
  {% if stub_runs %}
  <p class="stubbanner">Stub mode — results are canned <code>example_output</code>; no capability is called.</p>
  {% endif %}
  <header class="topbar">
    <a class="brand" href="/"><img class="brand__mark" src="/static/favicon.svg?v={{ asset_v }}" alt="" width="22" height="22">Automation&nbsp;Dashboard</a>
    <nav>{% block nav %}<a href="/jobs">Job posts</a> <a href="/documents">Documents</a><span class="topbar__sep" aria-hidden="true"></span>{% if user_email %}<span class="topbar__user">{{ user_email }}</span> {% endif %}<a href="/logout">Sign out</a>{% endblock %}</nav>
  </header>
  <main>
    {% block main %}{% endblock %}
  </main>
</body>
</html>
