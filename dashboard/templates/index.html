{% extends "base.html" %}
{% block main %}
<section class="panel">
  <h1>Capabilities</h1>
  <ul class="pagelist">
    {% for a in area_nav | default([]) %}
    <li>
      <a href="{{ a.nav[0][1] }}"><span class="pagelist__title">{{ a.title }}</span></a>
      <p class="pagelist__summary">{{ a.summary }}</p>
    </li>
    {% endfor %}
  </ul>
</section>
{% endblock %}
